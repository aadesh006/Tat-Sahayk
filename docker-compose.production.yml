name: ${COMPOSE_PROJECT_NAME:-tat-sahayk-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    platform: linux/amd64
    image: postgis/postgis:16-3.4
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tat_sahayk}
      POSTGRES_USER: ${POSTGRES_USER:-tat_sahayk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tat_sahayk} -d ${POSTGRES_DB:-tat_sahayk}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

    logging: *default-logging

    networks:
      - tat_sahayk_network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: production
      DEBUG: "false"

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      STORMGLASS_API_KEY: ${STORMGLASS_API_KEY:-}

    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - nltk_cache:/root/nltk_data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8000/health > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 18
      start_period: 180s

    logging: *default-logging

    networks:
      - tat_sahayk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "false"

    restart: unless-stopped

    environment:
      PROJECT_NAME: Tat-Sahayk API
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 5001
      API_V1_PREFIX: /api/v1

      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}

      CORS_ORIGINS: "${CORS_ORIGINS:-}"

      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_FALLBACK_ENABLED: "${AI_FALLBACK_ENABLED:-false}"

      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT_SECONDS: ${ML_SERVICE_TIMEOUT_SECONDS:-30}
      ML_SERVICE_HEALTH_PATH: /health
      ML_SERVICE_ANALYZE_PATH: /api/v1/analyze/report

      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      LOCAL_MEDIA_DIR: /app/uploads
      LOCAL_MEDIA_URL: /uploads
      MEDIA_MAX_FILE_SIZE_MB: ${MEDIA_MAX_FILE_SIZE_MB:-10}
      MEDIA_ALLOWED_CONTENT_TYPES: ${MEDIA_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp,image/gif}

      ENABLE_SOCIAL_HARVESTER: "${ENABLE_SOCIAL_HARVESTER:-false}"
      ENABLE_CLUSTER_ANALYSIS: "${ENABLE_CLUSTER_ANALYSIS:-false}"
      SOCIAL_HARVEST_INTERVAL_MINUTES: ${SOCIAL_HARVEST_INTERVAL_MINUTES:-15}
      CLUSTER_ANALYSIS_INTERVAL_MINUTES: ${CLUSTER_ANALYSIS_INTERVAL_MINUTES:-15}

      AWS_ENABLED: "${AWS_ENABLED:-false}"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_BEDROCK_MODEL_ID: ${AWS_BEDROCK_MODEL_ID:-us.amazon.nova-pro-v1:0}
      AWS_BEDROCK_TEXT_MODEL_ID: ${AWS_BEDROCK_TEXT_MODEL_ID:-us.amazon.nova-micro-v1:0}
      SES_SOURCE_EMAIL: ${SES_SOURCE_EMAIL:-}

      PHONE_OTP_PROVIDER: ${PHONE_OTP_PROVIDER:-disabled}
      PHONE_OTP_TTL_MINUTES: ${PHONE_OTP_TTL_MINUTES:-10}
      PHONE_OTP_RESEND_SECONDS: ${PHONE_OTP_RESEND_SECONDS:-60}
      PHONE_OTP_MAX_ATTEMPTS: ${PHONE_OTP_MAX_ATTEMPTS:-5}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:5001/health/ready > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

    logging: *default-logging

    networks:
      - tat_sahayk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null http://localhost/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

    logging: *default-logging

    networks:
      - tat_sahayk_network

volumes:
  postgres_data:
  uploads_data:
  huggingface_cache:
  nltk_cache:

networks:
  tat_sahayk_network:
    driver: bridge
