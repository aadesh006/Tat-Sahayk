services:
  db:
    platform: linux/amd64
    image: postgis/postgis:16-3.4
    container_name: tat-sahayk-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tat_sahayk}
      POSTGRES_USER: ${POSTGRES_USER:-tat_sahayk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tat_sahayk_local_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tat_sahayk} -d ${POSTGRES_DB:-tat_sahayk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - tat_sahayk_network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile

    container_name: tat-sahayk-ml
    restart: unless-stopped

    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: development
      DEBUG: "true"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      STORMGLASS_API_KEY: ${STORMGLASS_API_KEY:-}

    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"

    volumes:
      - ./ml-service:/app
      - huggingface_cache:/root/.cache/huggingface
      - nltk_cache:/root/nltk_data

    command:
      [
        "uvicorn",
        "src.api.routes.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8000/health > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s

    networks:
      - tat_sahayk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"

    container_name: tat-sahayk-backend
    restart: unless-stopped

    environment:
      PROJECT_NAME: Tat-Sahayk API
      ENVIRONMENT: development
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 5001
      API_V1_PREFIX: /api/v1

      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tat_sahayk}:${POSTGRES_PASSWORD:-tat_sahayk_local_password}@db:5432/${POSTGRES_DB:-tat_sahayk}
      DATABASE_SSL_MODE: disable

      CORS_ORIGINS: http://localhost:5173,http://localhost:5174

      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-false}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT_SECONDS: 30

      ENABLE_SOCIAL_HARVESTER: "true"
      ENABLE_CLUSTER_ANALYSIS: "false"

      AWS_ENABLED: ${AWS_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}

      PHONE_OTP_PROVIDER: ${PHONE_OTP_PROVIDER:-console}
      PHONE_OTP_TTL_MINUTES: ${PHONE_OTP_TTL_MINUTES:-10}
      PHONE_OTP_RESEND_SECONDS: ${PHONE_OTP_RESEND_SECONDS:-60}
      PHONE_OTP_MAX_ATTEMPTS: ${PHONE_OTP_MAX_ATTEMPTS:-5}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      LOCAL_MEDIA_DIR: ${LOCAL_MEDIA_DIR:-/app/uploads}
      LOCAL_MEDIA_URL: ${LOCAL_MEDIA_URL:-/uploads}
      MEDIA_MAX_FILE_SIZE_MB: ${MEDIA_MAX_FILE_SIZE_MB:-10}
      MEDIA_ALLOWED_CONTENT_TYPES: ${MEDIA_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp,image/gif}

    ports:
      - "${BACKEND_PORT:-5001}:5001"

    volumes:
      - ./backend:/app

    command:
      [
        "sh",
        "scripts/start.sh",
        "--reload",
      ]

    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:5001/health/ready > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - tat_sahayk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    container_name: tat-sahayk-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null http://localhost/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    networks:
      - tat_sahayk_network

volumes:
  postgres_data:
  huggingface_cache:
  nltk_cache:

networks:
  tat_sahayk_network:
    driver: bridge
